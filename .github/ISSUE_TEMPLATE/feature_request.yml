name: Feature request
description: Propose a change to Sculpt.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do with Sculpt today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behavior you would like.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Sculpt or Reins
      description: >-
        Sculpt is a showcase for Reins. Explain why this change belongs in Sculpt
        and not in the Reins runtime.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
